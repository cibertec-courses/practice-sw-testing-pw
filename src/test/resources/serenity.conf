serenity {
  project.name = "Practice Software Testing - Toolshop"
  take.screenshots = FOR_FAILURES
  report.show.step.details = true
  report.show.manual.tests = false
  console.colors = true
  tag.failures = true
  restart.browser.for.each = never
}

# Propiedades leídas por edu.pe.ciibertec.utils.Environment
base.url = "https://practicesoftwaretesting.com"
browser  = "chromium"
headless = false
slowmo   = 0
timeout  = 30000

environments {
  default {
    base.url = "https://practicesoftwaretesting.com"
  }
  ci {
    base.url = "https://practicesoftwaretesting.com"
    headless = true
  }
}